name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import rule
        run: node scripts/check-imports.mjs
      - name: App branches touch only their app
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-app-branch.mjs "$HEAD_REF" $(git diff --name-only "$BASE_SHA"...HEAD)
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Synth every stack (no AWS credentials needed)
        working-directory: infra
        run: |
          npx cdk synth -q -c env=staging
          npx cdk synth -q -c env=production
