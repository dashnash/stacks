name: CI

# Pull requests only: `check` is a required status of the main ruleset. After a merge, Deploy's build
# job runs the tests on main (#47 WF-03: they used to run twice per merge, here and there).
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Public repo: PRs from forks never run on the self-hosted runner (#93).
    runs-on: ${{ (vars.LINUX_RUNNER && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # No dependency's install script runs in CI (#104); this keeps the list of packages that
      # have one reviewed (scripts/install-scripts-allowlist.json).
      - name: Install scripts allowlisted (#104)
        run: node scripts/check-install-scripts.mjs
      - name: Lint workflows
        # The official image bundles shellcheck; no download step to flake.
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Import rule
        run: node scripts/check-imports.mjs
      - name: Actions pinned to commit SHAs (#99)
        run: node scripts/check-action-pins.mjs
      - name: PR paths (app PRs change one app; anything else is platform work)
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD)
          node scripts/check-app-branch.mjs "$HEAD_REF" "${changed[@]}"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Synth every stack (no AWS credentials needed)
        working-directory: infra
        run: |
          npx cdk synth -q -c env=staging
          npx cdk synth -q -c env=production
