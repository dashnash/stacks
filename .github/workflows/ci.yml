name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.LINUX_RUNNER && fromJSON(vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint workflows
        # The official image bundles shellcheck; no download step to flake.
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Import rule
        run: node scripts/check-imports.mjs
      - name: PR paths (app PRs change one app; anything else is platform work)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD)
          node scripts/check-app-branch.mjs "$HEAD_REF" "${changed[@]}"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build game server images (apps with the gameServer module; arm64, no emulation needed)
        run: npm run build-game-images
      - name: Synth every stack (no AWS credentials needed)
        working-directory: infra
        # The same path as the deploy builds: the real image tarballs, not the no-Docker placeholder.
        run: |
          npx cdk synth -q -c env=staging -c requireGameImage=true
          npx cdk synth -q -c env=production -c requireGameImage=true
