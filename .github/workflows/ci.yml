name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.LINUX_RUNNER && fromJSON(vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint workflows
        # The official image bundles shellcheck; no download step to flake.
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Import rule
        run: node scripts/check-imports.mjs
      - name: Mac runner switch (shellcheck and fake-GitHub tests)
        run: |
          # Not on every runner image (the homelab image doesn't ship it).
          command -v shellcheck > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck scripts/mac-runner.sh scripts/mac-runner.test.sh
          bash scripts/mac-runner.test.sh
      - name: PR paths (app PRs change one app; anything else is platform work)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD)
          node scripts/check-app-branch.mjs "$HEAD_REF" "${changed[@]}"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Synth every stack (no AWS credentials needed)
        working-directory: infra
        run: |
          npx cdk synth -q -c env=staging
          npx cdk synth -q -c env=production
