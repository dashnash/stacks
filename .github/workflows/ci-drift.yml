name: CI policy drift

# stacks-ci is deployed by hand (docs/SETUP.md §2), so a merged change to the staging guardrail
# policies protects nothing until someone deploys it (#101). This synthesizes stacks-ci from main
# (no credentials), reads the live default version of stacks-test-boundary and stacks-test-cfn-exec
# with a read-only role, and fails on any difference (GitHub emails the owner). Deploy also calls it
# with warn: differences become warnings there and never block a deploy.
#
# The role (stacks-ci-drift-check) trusts only main by ref: this job has no environment, and there
# is no pull_request trigger. Until AWS_DRIFT_ROLE_ARN is set it only says so.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/infra/src/ci-stack.ts
      - infra/bin/stacks.ts
      - stacks.config.json
  workflow_call:
    inputs:
      warn:
        description: Report differences as warnings and pass
        type: boolean
        default: false

concurrency:
  group: ci-drift-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drift:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.LINUX_RUNNER && fromJSON(vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    continue-on-error: ${{ inputs.warn == true }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up yet?
        if: vars.AWS_DRIFT_ROLE_ARN == ''
        run: echo "::notice title=Drift check not set up::Set the repository variable AWS_DRIFT_ROLE_ARN (docs/SETUP.md §2)."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: vars.AWS_DRIFT_ROLE_ARN != ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: vars.AWS_DRIFT_ROLE_ARN != ''
        with:
          node-version: 22
          cache: npm
      - if: vars.AWS_DRIFT_ROLE_ARN != ''
        run: npm ci --ignore-scripts
      - name: Synth stacks-ci (no AWS credentials)
        if: vars.AWS_DRIFT_ROLE_ARN != ''
        working-directory: infra
        run: npx cdk synth -q -c ci=true -o ../cdk.out-ci
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: vars.AWS_DRIFT_ROLE_ARN != ''
        id: aws
        with:
          role-to-assume: ${{ vars.AWS_DRIFT_ROLE_ARN }}
          role-session-name: ci-drift
          aws-region: us-east-1
      - name: Compare with the live policies
        if: vars.AWS_DRIFT_ROLE_ARN != ''
        env:
          ACCOUNT: ${{ steps.aws.outputs.aws-account-id }}
          WARN: ${{ inputs.warn == true && '--warn' || '' }}
        run: |
          # shellcheck disable=SC2086 # WARN is empty or one flag
          node scripts/check-ci-drift.mjs cdk.out-ci/stacks-ci.template.json --account "$ACCOUNT" $WARN
