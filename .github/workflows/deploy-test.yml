name: Deploy app to staging

# Every merge to main already redeploys all apps to staging (deploy.yml). Use this to try a
# branch on staging before merging. Start it from a session or terminal (always on main; the
# branch is an input):
#   gh workflow run deploy-test.yml -f app=<slug> -f ref=<branch>
#
# The branch's code only runs in the build job, which has no AWS credentials. The deploy job
# runs main's code, checks the assembly, and deploys it with the staging role (see the spec's
# "Staging deploys without AWS credentials").
on:
  workflow_dispatch:
    inputs:
      app:
        description: App slug (folder under apps/)
        required: true
      ref:
        description: Branch, tag or commit to deploy
        required: true

concurrency:
  group: deploy-test-${{ inputs.app }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Zones marked "lookup" in stacks.config.json, resolved by name (read-only, through staging's
  # CDK lookup role) and handed to synth. Everything here is main's code; nothing is deployed.
  zones:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.LINUX_RUNNER && fromJSON(vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      ids: ${{ steps.lookup.outputs.ids }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        id: staging
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: us-east-1
      # Read-only from here: the staging bootstrap's lookup role (the staging role may assume
      # cdk-stktest-*). No AWS CLI on the runner: the action chains the role, the script signs.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ steps.staging.outputs.aws-account-id }}:role/cdk-stktest-lookup-role-${{ steps.staging.outputs.aws-account-id }}-us-east-1
          role-chaining: true
          role-skip-session-tagging: true
          role-session-name: zone-lookup
          aws-region: us-east-1
      - name: Look up hosted zones
        id: lookup
        run: |
          set -euo pipefail
          ids="$(node scripts/lookup-zones.mjs)"
          echo "ids=${ids}" >> "$GITHUB_OUTPUT"

  build:
    needs: zones
    runs-on: ${{ vars.LINUX_RUNNER && fromJSON(vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    steps:
      - name: Check inputs
        env:
          APP: ${{ inputs.app }}
        run: '[[ "$APP" =~ ^[a-z][a-z0-9-]{1,28}[a-z0-9]$ ]] || { echo "bad app slug"; exit 1; }'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test and build the app
        env:
          VITE_STACKS_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          npm test -w "apps/${{ inputs.app }}"
          # The commit actually built (the branch's), for the app's footer.
          VITE_STACKS_BUILD_SHA="$(git rev-parse HEAD)" npm run build -w "apps/${{ inputs.app }}"
      - name: Synth (no AWS credentials in this job)
        working-directory: infra
        env:
          HOSTED_ZONE_IDS: ${{ needs.zones.outputs.ids }}
        run: |
          # The same commit as the web build, stamped on the Lambda's log lines.
          STACKS_BUILD_SHA="$(git rev-parse HEAD)"
          export STACKS_BUILD_SHA
          npx cdk synth -q -c env=staging -c "app=${{ inputs.app }}" -c "hostedZoneIds=${HOSTED_ZONE_IDS}" -c requireZones=true -o ../cdk.out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cdk-out
          path: cdk.out
          retention-days: 3

  deploy:
    needs: build
    runs-on: ${{ vars.LINUX_RUNNER && fromJSON(vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      # main's code, not the branch's: only reviewed code runs next to credentials.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cdk-out
          path: cdk.out
      - name: Check the assembly
        run: npx tsx scripts/check-assembly.ts cdk.out "stacks-test-app-${{ inputs.app }}"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy
        run: npx cdk deploy --app cdk.out "stacks-test-app-${{ inputs.app }}" --require-approval never --outputs-file outputs.json
      - name: Summary
        run: |
          node -e "const o=require('./outputs.json');for(const[s,v]of Object.entries(o))console.log('Staging URL: '+v.SiteURL)" >> "$GITHUB_STEP_SUMMARY"
