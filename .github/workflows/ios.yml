name: iOS

# The DashyHQ app (native/ios). Its logic is a Foundation-only Swift package, tested on Linux
# (cheap). macOS minutes count 10x, so macOS runs only when something that goes into the app
# changed (the `core` job decides): one simulator build on such PRs; on main, both apps are signed
# and uploaded to TestFlight (docs/IOS_SETUP.md); and every two months, so testers never hit
# TestFlight's 90-day expiry. Workflow, script, test and docs changes stay on Linux; run the
# workflow by hand on main to release anyway.
#
# Runners (#103): releases use vars.MACOS_RUNNER (the Mac's release user, which holds the signing
# keychain); PR simulator builds use vars.MACOS_PR_RUNNER (a second runner under a separate,
# non-admin macOS user). Until that runner exists (MACOS_PR_RUNNER unset), same-repo PRs fall back
# to MACOS_RUNNER, as before #103; set MACOS_PR_RUNNER to end the sharing. Unset means macos-26.
on:
  pull_request:
    paths:
      - native/**
      - scripts/ios-xcconfig.mjs
      - scripts/asc-provision.mjs
      - stacks.config.json
      - .github/workflows/ios.yml
  push:
    branches: [main]
    paths:
      - native/**
      - scripts/ios-xcconfig.mjs
      - scripts/asc-provision.mjs
      - stacks.config.json
      - .github/workflows/ios.yml
  schedule:
    - cron: '23 9 1 */2 *' # every two months (at most 62 days apart): before TestFlight's 90-day expiry
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned for self-hosted macOS runners, which don't use Homebrew (see "Generate the Xcode project").
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  core:
    name: Shell logic (Swift on Linux)
    runs-on: ${{ (vars.LINUX_RUNNER && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      app: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Did anything that goes into the app change?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The app's own sources, its build settings and project; not Core's tests or docs.
          case "$EVENT" in
            pull_request) range="$BASE...HEAD" ;;
            push) range="$BEFORE..HEAD" ;;
            *) echo "app=true" >> "$GITHUB_OUTPUT"; exit 0 ;; # schedule, by hand: always
          esac
          if ! changed="$(git diff --name-only "$range" 2> /dev/null)"; then
            echo "Can't diff $range: building to be safe"
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          app="$(printf '%s\n' "$changed" | grep '^native/ios/' | grep -v '^native/ios/Core/Tests/' | grep -v '\.md$' || true)"
          if [ -n "$app" ]; then
            printf 'App inputs changed:\n%s\n' "$app"
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=No macOS build::Nothing that goes into the app changed (only $(printf '%s\n' "$changed" | wc -l | tr -d ' ') other file(s))."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build settings match stacks.config.json
        run: node scripts/ios-xcconfig.mjs --check
      - run: swift --version
      - name: Tests (incl. native/protocol/v1.json)
        run: swift test --package-path native/ios/Core

  app:
    name: App (simulator build, unsigned)
    needs: core
    # PRs that change the app only. On main the release job builds (and signs) the same code.
    if: github.event_name == 'pull_request' && needs.core.outputs.app == 'true'
    # PR code belongs on its own runner under a separate macOS user (MACOS_PR_RUNNER, #103), away
    # from the Mac that signs releases. Until it is set up, the release Mac (MACOS_RUNNER) as before;
    # forks and an unset Mac: GitHub-hosted macos-26.
    runs-on: ${{ (github.event.pull_request.head.repo.full_name == github.repository && (vars.MACOS_PR_RUNNER || vars.MACOS_RUNNER)) && fromJSON(vars.MACOS_PR_RUNNER || vars.MACOS_RUNNER) || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use the newest Xcode
        run: |
          # For this job only: no sudo, and the machine's Xcode selection is left alone (the runner may be a shared Mac).
          # The newest Xcode installed wins, by version number.
          best=""
          bestver=""
          for candidate in /Applications/Xcode*.app; do
            [ -d "$candidate" ] || continue
            version="$(DEVELOPER_DIR="$candidate/Contents/Developer" xcodebuild -version 2>/dev/null | head -n 1 || true)"
            case "$version" in
              "Xcode "[0-9]*) ;;
              *) continue ;;
            esac
            ver="${version#Xcode }"
            if [ -z "$bestver" ] || [ "$(printf '%s\n%s\n' "$bestver" "$ver" | sort -V | tail -n 1)" = "$ver" ]; then
              best="$candidate"
              bestver="$ver"
            fi
          done
          if [ -z "$best" ]; then
            echo "::error::No Xcode found in /Applications"
            exit 1
          fi
          echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$best/Contents/Developer" xcodebuild -version
      - name: Generate the Xcode project
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_ENV_HINTS: '1'
        run: |
          if ! command -v xcodegen > /dev/null; then
            if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
              # A pinned release, checksum-verified: no Homebrew on a self-hosted Mac.
              zip="$RUNNER_TEMP/xcodegen.zip"
              curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
              echo "$XCODEGEN_SHA256  $zip" | shasum -a 256 -c -
              unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen-dist"
              export PATH="$RUNNER_TEMP/xcodegen-dist/xcodegen/bin:$PATH"
            else
              brew install xcodegen
            fi
          fi
          xcodegen generate --spec native/ios/project.yml
      - name: Swift packages (cached)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/spm
          key: spm-${{ hashFiles('native/ios/project.yml') }}
      - name: Build for the simulator
        # One environment is enough: both compile the same code (only settings and the icon
        # differ), and the release on main builds both.
        run: |
          xcodebuild build -quiet \
            -project native/ios/DashyHQ.xcodeproj \
            -scheme "DashyHQ Test" \
            -configuration Staging \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGNING_ALLOWED=NO \
            STACKS_GIT_COMMIT="$GITHUB_SHA"

  release:
    name: Sign and upload to TestFlight
    needs: core
    # On main: when the app changed, every two months, or by hand.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.core.outputs.app == 'true'
    # The release Mac (MACOS_RUNNER) runs only main's code; the fork clause is moot here (no PRs)
    # but keeps the workflow-wide guard uniform.
    runs-on: ${{ (vars.MACOS_RUNNER && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.MACOS_RUNNER) || 'macos-26' }}
    timeout-minutes: 45
    # Only main may use this environment (docs/IOS_SETUP.md); its secrets are the App Store Connect
    # key. Each run makes its own signing certificate, and the next run revokes it.
    environment: ios-release
    outputs:
      build: ${{ steps.upload.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Set up yet?
        id: ready
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          team="$(sed -n 's/^DEVELOPMENT_TEAM = *//p' native/ios/Config/Production.xcconfig)"
          missing=""
          [ -n "$team" ] || missing="$missing appleTeamId (stacks.config.json)"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::notice title=TestFlight upload skipped::Not set up yet:$missing. See docs/IOS_SETUP.md."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The upload needs both apps to exist in App Store Connect (Apple has no API to create them).
          set +e
          node scripts/asc-provision.mjs --check-apps
          apps=$?
          set -e
          if [ "$apps" = 3 ]; then
            echo "::notice title=TestFlight upload skipped::Create the app records in App Store Connect first (docs/IOS_SETUP.md steps 4-5)."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$apps" = 0 ] || exit "$apps"
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          {
            echo "go=true"
            echo "team=$team"
            echo "key=$key"
          } >> "$GITHUB_OUTPUT"
      - name: Use the newest Xcode
        if: steps.ready.outputs.go == 'true'
        run: |
          # For this job only: no sudo, and the machine's Xcode selection is left alone (the runner may be a shared Mac).
          # The newest Xcode installed wins, by version number.
          best=""
          bestver=""
          for candidate in /Applications/Xcode*.app; do
            [ -d "$candidate" ] || continue
            version="$(DEVELOPER_DIR="$candidate/Contents/Developer" xcodebuild -version 2>/dev/null | head -n 1 || true)"
            case "$version" in
              "Xcode "[0-9]*) ;;
              *) continue ;;
            esac
            ver="${version#Xcode }"
            if [ -z "$bestver" ] || [ "$(printf '%s\n%s\n' "$bestver" "$ver" | sort -V | tail -n 1)" = "$ver" ]; then
              best="$candidate"
              bestver="$ver"
            fi
          done
          if [ -z "$best" ]; then
            echo "::error::No Xcode found in /Applications"
            exit 1
          fi
          echo "DEVELOPER_DIR=$best/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$best/Contents/Developer" xcodebuild -version
      - name: Generate the Xcode project
        if: steps.ready.outputs.go == 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_ENV_HINTS: '1'
        run: |
          if ! command -v xcodegen > /dev/null; then
            if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
              # A pinned release, checksum-verified: no Homebrew on a self-hosted Mac.
              zip="$RUNNER_TEMP/xcodegen.zip"
              curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
              echo "$XCODEGEN_SHA256  $zip" | shasum -a 256 -c -
              unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen-dist"
              export PATH="$RUNNER_TEMP/xcodegen-dist/xcodegen/bin:$PATH"
            else
              brew install xcodegen
            fi
          fi
          xcodegen generate --spec native/ios/project.yml
      - name: Swift packages (cached)
        if: steps.ready.outputs.go == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/spm
          key: spm-${{ hashFiles('native/ios/project.yml') }}
      - name: A signing certificate and App Store profiles for this run
        id: signing
        if: steps.ready.outputs.go == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Nothing is stored: the key is made here, Apple issues a certificate for it, and the
          # next run revokes it (this run's cleanup does if nothing was uploaded). /usr/bin/openssl
          # is macOS's own, whose .p12 files `security import` always reads.
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          chmod 700 "$dir"
          /usr/bin/openssl req -new -newkey rsa:2048 -nodes -keyout "$dir/key.pem" -out "$dir/request.csr" -subj '/CN=DashyHQ CI/O=DashyHQ' 2> /dev/null
          # Both profile places: Xcode 16+ reads the second, older tools the first.
          node scripts/asc-provision.mjs --release-signing "$dir/request.csr" "$dir" \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          /usr/bin/openssl x509 -inform DER -in "$dir/certificate.cer" -out "$dir/certificate.pem"
          p12pass="$(/usr/bin/openssl rand -hex 24)"
          /usr/bin/openssl pkcs12 -export -inkey "$dir/key.pem" -in "$dir/certificate.pem" -out "$dir/signing.p12" -passout "pass:$p12pass"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          # A cancelled earlier run on this runner can leave its keychain behind: take it off the
          # search list and delete it, then save the user's list for the cleanup to restore.
          existing=()
          while IFS= read -r k; do
            k="$(printf '%s' "$k" | sed -e 's/^ *"//' -e 's/" *$//')"
            if [ -n "$k" ] && [ "$k" != "$keychain" ]; then existing+=("$k"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${existing[@]}"
          if [ -e "$keychain" ]; then security delete-keychain "$keychain" 2> /dev/null || rm -f "$keychain"; fi
          security list-keychains -d user > "$RUNNER_TEMP/keychains.before"
          pass="$(/usr/bin/openssl rand -hex 24)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$dir/signing.p12" -k "$keychain" -P "$p12pass" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" > /dev/null
          # Keep the login keychain on the search list too (Xcode looks there for Apple's intermediates).
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm -f "$dir/key.pem" "$dir/signing.p12"
          cat "$dir/profiles.json"
          {
            echo "keychain=$keychain"
            echo "profiles=$dir/profiles.json"
          } >> "$GITHUB_OUTPUT"
      - name: Archive, sign and upload both apps
        id: upload
        if: steps.ready.outputs.go == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ steps.ready.outputs.team }}
          KEY: ${{ steps.ready.outputs.key }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          PROFILE_MAP: ${{ steps.signing.outputs.profiles }}
          RUN: ${{ github.run_number }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          # Every upload needs a new build number; a re-run of the same run gets the next one.
          build=$((RUN * 100 + ATTEMPT))
          echo "Build $build"
          # Manual signing with this run's certificate and profiles. No device needed, and no Xcode
          # account: the API key only uploads.
          upload=(-authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          for pair in "DashyHQ Test:Staging" "DashyHQ:Production"; do
            scheme="${pair%%:*}"
            config="${pair##*:}"
            bundle="$(sed -n 's/^PRODUCT_BUNDLE_IDENTIFIER = *//p' "native/ios/Config/$config.xcconfig")"
            profile="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[process.argv[2]] ?? "")' "$PROFILE_MAP" "$bundle")"
            if [ -z "$profile" ]; then
              echo "::error::No profile for $bundle in $PROFILE_MAP"
              exit 1
            fi
            options="$RUNNER_TEMP/ExportOptions-$config.plist"
            cat > "$options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$TEAM</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$bundle</key><string>$profile</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
            echo "::group::$scheme ($config): archive with \"$profile\""
            xcodebuild archive -quiet \
              -project native/ios/DashyHQ.xcodeproj \
              -scheme "$scheme" \
              -configuration "$config" \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/$config.xcarchive" \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
              DEVELOPMENT_TEAM="$TEAM" \
              DASHYHQ_PROFILE="$profile" \
              OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
              CURRENT_PROJECT_VERSION="$build" \
              STACKS_GIT_COMMIT="$GITHUB_SHA"
            echo "::endgroup::"
            echo "::group::$scheme ($config): upload to App Store Connect"
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/$config.xcarchive" \
              -exportOptionsPlist "$options" \
              -exportPath "$RUNNER_TEMP/export-$config" \
              "${upload[@]}"
            touch "$RUNNER_TEMP/signing/uploaded" # Apple may still be checking it: keep the certificate
            echo "::endgroup::"
          done
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "### Uploaded build $build of DashyHQ and DashyHQ Test" >> "$GITHUB_STEP_SUMMARY"
          echo "TestFlight shows them after Apple finishes processing (usually 5-15 minutes)." >> "$GITHUB_STEP_SUMMARY"
      - name: Revoke an unused certificate
        # A run that uploaded keeps its certificate until the next run revokes it, so Apple can
        # finish processing the build; one that failed before uploading anything revokes its own.
        if: always() && steps.ready.outputs.go == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          dir="$RUNNER_TEMP/signing"
          if [ -f "$dir/certificate-id" ] && [ ! -f "$dir/uploaded" ]; then
            node scripts/asc-provision.mjs --revoke-certificate "$(cat "$dir/certificate-id")"
          fi
      - name: Remove the key, keychain and profiles
        if: always()
        run: |
          # Restore the user's keychain search list, then delete ours. Other users' keychains are never touched.
          if [ -f "$RUNNER_TEMP/keychains.before" ]; then
            restore=()
            while IFS= read -r k; do
              k="$(printf '%s' "$k" | sed -e 's/^ *"//' -e 's/" *$//')"
              if [ -n "$k" ]; then restore+=("$k"); fi
            done < "$RUNNER_TEMP/keychains.before"
            if [ "${#restore[@]}" -gt 0 ]; then security list-keychains -d user -s "${restore[@]}" || true; fi
          fi
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true; fi
          # Only the profiles this run made, by UUID: other profiles on a shared Mac stay.
          if [ -f "$RUNNER_TEMP/signing/profile-uuids" ]; then
            while IFS= read -r uuid; do
              [ -n "$uuid" ] || continue
              rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
            done < "$RUNNER_TEMP/signing/profile-uuids"
          fi
          rm -rf "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/signing" "$RUNNER_TEMP/keychains.before"

  notes:
    name: TestFlight notes (the commit)
    needs: release
    if: needs.release.outputs.build != ''
    # TestFlight build numbers can only be numbers, so the commit goes in each build's "What to
    # Test" note. Apple lists a build a few minutes after the upload: wait for it here, on Linux,
    # rather than on the (10x) macOS runner.
    runs-on: ${{ (vars.LINUX_RUNNER && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON(vars.LINUX_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: ios-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Write "What to Test"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD: ${{ needs.release.outputs.build }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          short="$(git rev-parse --short=7 HEAD)"
          subject="$(git log -1 --format=%s HEAD)"
          # A merge commit says "Merge pull request #N from …"; its body's first line is the PR title.
          if [[ "$subject" == "Merge pull request #"* ]]; then
            title="$(git log -1 --format=%b HEAD | sed -n '/./{p;q;}')"
            pr="$(printf '%s' "$subject" | grep -o '#[0-9]*' | head -n1)"
            [ -n "$title" ] && subject="$title ($pr)"
          fi
          WHAT_TO_TEST="$(printf 'Commit %s: %s\n%s/commit/%s' "$short" "$subject" "$REPO_URL" "$GITHUB_SHA")"
          export WHAT_TO_TEST
          node scripts/asc-provision.mjs --what-to-test "$BUILD"
