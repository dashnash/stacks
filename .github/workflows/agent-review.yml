name: Agent review

# Merge gate (#111): a PR that changes packages/infra/, .github/ or platform/api/ needs an agent
# code review of its head commit, recorded as a PR comment by dashnash-agent carrying
#   <!-- agent-code-review sha=<head sha> -->
# (node scripts/agent-review-gate.mjs marker <sha> prints it). This posts the commit status
# `agent-review` that the ruleset on main requires; other PRs get "not required".
#
# pull_request_target and issue_comment run main's code with a write token: this job never checks
# out or runs the PR's code, and always runs on GitHub-hosted runners.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: agent-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  agent-review:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # The default branch's script, never the PR's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Post the agent-review status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_REVIEWERS: ${{ vars.AGENT_REVIEWERS }}
        run: node scripts/agent-review-gate.mjs
